<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>6lory — Doğrulanmış Kazanım</title>
    <meta name="theme-color" content="#172438" />
    <meta name="description" content="Doğrulanmış görev, puan ve ödül platformu." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/manus-storage/6lory-app-icon_b69505cd.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root">
      <main aria-live="polite" aria-busy="true" style="display:grid;min-height:100dvh;place-items:center;padding:24px;background:#f8fafc;color:#172438;font-family:DM Sans,system-ui,sans-serif">
        <section style="width:min(100%,440px);border:1px solid #dce7e8;border-radius:24px;background:#fff;padding:32px;text-align:center;box-shadow:0 16px 40px rgba(15,23,42,.08)">
          <div style="display:grid;width:44px;height:44px;place-items:center;margin:0 auto 16px;border-radius:16px;background:#0f766e;color:#fff;font-weight:800;font-size:18px">6</div>
          <p style="margin:0;font-weight:800;font-size:18px">6lory hazırlanıyor</p>
          <p style="margin:8px 0 0;color:#526173;font-size:14px;line-height:1.55">Güvenli görev ve ödül deneyimi yükleniyor.</p>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
    <script>
      const isManagedPreview = location.hostname.endsWith(".manus.computer") || location.hostname === "localhost" || location.hostname === "127.0.0.1";
      if (isManagedPreview) {
        navigator.serviceWorker?.getRegistrations().then(registrations => Promise.all(registrations.map(registration => registration.unregister()))).then(() => caches?.keys?.().then(keys => Promise.all(keys.filter(key => key.startsWith("6lory-shell-")).map(key => caches.delete(key)))));
      } else if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js?v=6", { updateViaCache: "none" }).then(registration => registration.update()).catch(() => {});
        });
      }
    </script>
  </body>

</html>
