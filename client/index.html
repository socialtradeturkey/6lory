<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>6lory — Doğrulanmış Kazanım</title>
    <meta name="theme-color" content="#172438" />
    <meta name="description" content="Doğrulanmış görev, puan ve ödül platformu." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/manus-storage/6lory-app-icon_b69505cd.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
    <script>
      const isManagedPreview = location.hostname.endsWith(".manus.computer") || location.hostname === "localhost" || location.hostname === "127.0.0.1";
      if (isManagedPreview) {
        navigator.serviceWorker?.getRegistrations().then(registrations => Promise.all(registrations.map(registration => registration.unregister()))).then(() => caches?.keys?.().then(keys => Promise.all(keys.filter(key => key.startsWith("6lory-shell-")).map(key => caches.delete(key)))));
      } else if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js"));
      }
    </script>
  </body>

</html>
